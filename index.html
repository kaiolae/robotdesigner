<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EvoGym Robot Builder v2.0</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
    text-align:center;
}

h1{
    margin-bottom:5px;
}

.subtitle{
    color:#666;
    margin-bottom:20px;
}

#grid{
    display:grid;
    grid-template-columns:repeat(5,60px);
    grid-template-rows:repeat(5,60px);
    gap:5px;
    justify-content:center;
    margin:20px auto;
}

.cell{
    width:60px;
    height:60px;
    border:2px solid #555;
    border-radius:8px;
    cursor:pointer;
    user-select:none;
    transition:0.15s;
}

.cell:hover{
    transform:scale(1.05);
}

.legend{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:8px;
}

.box{
    width:25px;
    height:25px;
    border:1px solid black;
}

input{
    font-size:18px;
    padding:10px;
    width:260px;
    max-width:90%;
    margin-bottom:20px;
}

button{
    font-size:18px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#1976d2;
    color:white;
    margin:5px;
}

button:hover{
    background:#125ea8;
}

#message{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>EvoGym Robot Builder</h1>

<div class="subtitle">
Tap each square to change its voxel type.
</div>

<div class="legend">
    <div class="legend-item"><div class="box" style="background:white"></div>Empty</div>
    <div class="legend-item"><div class="box" style="background:black"></div>Rigid</div>
    <div class="legend-item"><div class="box" style="background:#9e9e9e"></div>Soft</div>
    <div class="legend-item"><div class="box" style="background:orange"></div>Horizontal actuator</div>
    <div class="legend-item"><div class="box" style="background:#2196f3"></div>Vertical actuator</div>
</div>

<input
    id="student"
    type="text"
    required
    placeholder="Student name*">

<div id="grid"></div>

<button onclick="clearGrid()">Clear</button>
<button id="submitButton" onclick="submitRobot()">Submit Robot</button>

<div id="message"></div>

<script>

const COLORS = [
    "#ffffff", // Empty
    "#000000", // Rigid
    "#9e9e9e", // Soft
    "#ff9800", // Horizontal actuator
    "#2196f3"  // Vertical actuator
];

const LABELS = [
    "Empty",
    "Rigid",
    "Soft",
    "Horizontal actuator",
    "Vertical actuator"
];

const SIZE=5;

let robot=[];

function initialize(){

    const grid=document.getElementById("grid");

    for(let r=0;r<SIZE;r++){

        robot.push([]);

        for(let c=0;c<SIZE;c++){

            robot[r].push(0);

            const cell=document.createElement("div");

            cell.className="cell";
            cell.dataset.row=r;
            cell.dataset.col=c;

            cell.style.background=COLORS[0];

            cell.onclick=()=>{

                let value=robot[r][c];

                value=(value+1)%5;

                robot[r][c]=value;

                cell.style.background=COLORS[value];
                cell.title=LABELS[value];

            };

            grid.appendChild(cell);

        }

    }

}

initialize();

function clearGrid(){

    robot=Array.from({length:SIZE},()=>Array(SIZE).fill(0));

    document.querySelectorAll(".cell").forEach(c=>{
        c.style.background=COLORS[0];
        c.title="Empty";
    });

    message("");

}

function message(txt,color="green"){

    const m=document.getElementById("message");

    m.style.color=color;
    m.innerHTML=txt;

}

function validateRobot(){

    let actuators=0;
    let voxels=0;

    for(const row of robot){

        for(const v of row){

            if(v>0) voxels++;
            if (v === 3 || v === 4) actuators++;

        }

    }

    if(voxels===0){
        message("Robot is empty.","red");
        return false;
    }

    if(actuators===0){
        message("Robot needs at least one actuator.","red");
        return false;
    }

    return true;

}

function submitRobot() {
    const submitButton = document.getElementById("submitButton");
    const student = document.getElementById("student").value.trim();

    if (student.length === 0) {
        message("Please enter your name.", "red");
        return;
    }

    if (!validateRobot()) return;

    // Deaktiver knappen under innsending
    submitButton.disabled = true;
    submitButton.innerHTML = "Submitting...";

    const data = {
        student: student,
        timestamp: new Date().toISOString(),
        robot: robot
    };

    // FJERN mode: "no-cors" for å kunne lese feilmeldinger
    fetch(
        "https://script.google.com/macros/s/AKfycbwEsOACX_wayM3IqpXXbDN_UN3ptKCMcuOHjvi8pJXjkX-bg6sDJhDCTpT6DI7wrgG_AQ/exec",
        {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8" // Holder innholdstypen enkel for å unngå CORS-preflight problemer
            },
            body: JSON.stringify(data)
        }
    )
    .then(response => {
        // Sjekk om HTTP-statusen er OK (2xx)
        if (!response.ok) {
            throw new Error("Serveren svarte med HTTP-status " + response.status);
        }
        return response.json(); // Tolk svaret som JSON
    })
    .then(resData => {
        // Sjekk om Google Script rapporterte en intern feil (fra try/catch-blokken i doPost)
        if (resData.status === "Failed") {
            throw new Error(resData.error);
        }

        // Suksesshåndtering
        message("Robot submitted successfully!");
        clearGrid();
        document.getElementById("student").value = "";
        submitButton.innerHTML = "Submitted ✓";
    })
    .catch(error => {
        // NÅ vil denne fange opp den nøyaktige feilmeldingen!
        console.error("Innsendingsfeil:", error);
        message("Error: " + error.message, "red");

        // Aktiver knappen igjen så brukeren kan prøve på nytt
        submitButton.disabled = false;
        submitButton.innerHTML = "Submit Robot";
    });
}


</script>

</body>
</html>
